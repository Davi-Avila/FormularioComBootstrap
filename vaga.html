<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhe conosco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="vaga.css">
</head>

<header>
    <h2>Formulário de Vaga de Emprego</h2>
</header>

<body class="d-flex flex-column min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <form>
                    <div class="input-group mb-4">
                        <span class="input-group-text" id="inputGroup-sizing-default">Nome <span
                                class="text-danger">*</span></span>
                        <input required type="text" class="form-control" placeholder="Nome completo"
                            aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
                    </div>

                    <div class="input-group mb-4">
                        <input type="text" required class="form-control" placeholder="E-Mail"
                            aria-label="Recipient’s username" aria-describedby="basic-addon2">
                        <span class="input-group-text" id="basic-addon2">@gmail.com <span
                                class="text-danger">*</span></span>
                    </div>

                    <div class="input-group mb-4">
                        <label class="input-group-text" for="inputGroupSelect01">Área de Interesse <span
                                class="text-danger">*</span></label>
                        <select required class="form-select" id="inputGroupSelect01">
                            <option selected disabled value="">Selecione</option>
                            <option value="1">Desenvolvimento</option>
                            <option value="2">Design</option>
                            <option value="3">Suporte</option>
                            <option value="4">Comercial</option>
                        </select>
                    </div>

                    <div class="input-group mb-4">
                        <label class="input-group-text" for="inputGroupSelect01">Nível de Experiência</label>
                        <select class="form-select" id="inputGroupSelect01">
                            <option selected>Selecione</option>
                            <option value="1">Júnior</option>
                            <option value="2">Pleno</option>
                            <option value="3">Sênior</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="basic-url" class="form-label">Link do Currículo <span
                                class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text" id="basic-addon3">https://</span>
                            <input required type="text" class="form-control" id="basic-url"
                                placeholder="Exemplo: Link do Google Drive"
                                aria-describedby="basic-addon3 basic-addon4">
                        </div>
                    </div>

                    <div class="input-group mb-4">
                        <label class="input-group-text" for="inputGroupSelect01">Disponibilidade de horário</label>
                        <select class="form-select" id="inputGroupSelect01">
                            <option selected>Selecione</option>
                            <option value="1">Manhã</option>
                            <option value="2">Tarde</option>
                            <option value="3">Noite</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <span class="input-group-text">Carta de Apresentação</span>
                        <textarea class="form-control" rows="3" placeholder="Minha carta de apresentação..."
                            aria-label="With textarea"></textarea>
                    </div>
                    <button id="enviar" type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

<footer class="p-3 fixed-bottom">
    <p>Davi Desenvolvimentos Inc</p>
</footer>

</html>
